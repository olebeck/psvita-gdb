[package]
name = "vita-gdb"
version = "0.1.0"
edition = "2024"

[dependencies]
gdbstub = { git = "https://github.com/olebeck/gdbstub", branch = "dev/0.8", default-features = false }
gdbstub_arch = { git = "https://github.com/olebeck/gdbstub", branch = "dev/0.8", default-features = false }
vitasdk-sys = { git = "https://github.com/olebeck/vitasdk-sys", features = [
    "SceSysclibForDriver_stub",
    "SceDebugForDriver_stub",
    "SceSysmemForDriver_stub",
    "SceProcessmgrForDriver_stub",
    "SceThreadmgrForDriver_stub",
    "SceNetPsForDriver_stub",
    "SceSysrootForDriver_stub",
    "SceCpuForDriver_stub",
    "SceDipswForDriver_stub",
    "SceIntrmgrForDriver_stub",
    "SceProcEventForDriver_stub",
    "SceIofilemgrForDriver_stub",
    "SceAppMgrForDriver_stub",
    "SceKernelSuspendForDriver_stub",
    "SceModulemgrForDriver_stub",
    "SceBacktraceForDriver_stub",
    "SceSysconForDriver_stub"
] }
arm-next-pc = { path = "../arm-next-pc" }
heapless = { version = "0.9.3", default-features = false }
pastey = "0.2.3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
collapsible_if = "allow"
