[package]
name = "arm-next-pc"
version = "0.1.0"
edition = "2024"

[features]
default = ["exarmo"]
std = []
exarmo = ["dep:exarmo-aarch32"]

[dependencies]
exarmo-aarch32 = { version = "0.4.0", default-features = false, optional = true }

[dev-dependencies]
asm-rs-macros = { version = "0.2.0", default-features = false }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
