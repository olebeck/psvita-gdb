on:
  push:
    branches:
      - master
    tags:
      v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install VitaSDK
        uses: olebeck/setup-vitasdk@v1
        with:
          packages: taihen

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build release
        run: just release

      - name: Copy skprx
        run: |
          mkdir -p dist
          cp target/armv7-sony-vita-newlibeabihf/release/vita-gdb.skprx dist/

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: psvita-gdb
          path: dist/

      - name: Create prerelease
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: dist/*
